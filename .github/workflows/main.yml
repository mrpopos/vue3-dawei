name: Deploy to GitHub Pages
 
on:
  push:
    branches:
      - h5  # 触发部署的分支，例如main或master
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # 使用Ubuntu作为运行环境
    steps:
      - name: Checkout code  # 检出代码
        uses: actions/checkout@v2
 
      - name: Set up Node.js  # 设置Node.js环境
        uses: actions/setup-node@v2
        with:
          node-version: '20'  # 使用Node.js的版本，根据你的项目需求调整

      - name: Install pnpm  # 安装pnpm
        run: npm install -g pnpm
 
      - name: Install dependencies  # 安装依赖
        run: pnpm install
 
      - name: Build project  # 构建项目
        run: pnpm build:prod
 
      - name: Deploy to GitHub Pages  # 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # 使用GitHub的token进行认证
          publish_dir: ./dist  # 指定构建产物的目录，通常是dist或build目录
